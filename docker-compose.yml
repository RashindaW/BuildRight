# Proves the SQLite -> PostgreSQL swap: the API talks to Postgres with only
# DATABASE_URL changed. Redis backs rate limiting in a multi-process setup.
#
# Usage:
#   ANTHROPIC_API_KEY=sk-ant-... SECRET_KEY=... docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cutdry
      POSTGRES_PASSWORD: cutdry
      POSTGRES_DB: cutdry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutdry"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Object storage for product imagery + chat uploads (S3-compatible; swap the
  # endpoint for S3/GCS/R2 in prod). Console at http://localhost:9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-buildright}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-buildright-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cutdry:cutdry@postgres:5432/cutdry
      RATE_LIMIT_STORAGE: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-REPLACE_ME}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cutdry.example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Multi-agent router + scale + multimodal
      MODEL_ROUTER_ENABLED: ${MODEL_ROUTER_ENABLED:-true}
      CATALOG_TARGET: ${CATALOG_TARGET:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-placeholder}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # Object storage (MinIO in dev)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-buildright}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-buildright-secret}
      # Voice (optional STT provider for /media/transcribe; groq = free tier)
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
