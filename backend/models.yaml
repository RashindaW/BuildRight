  #   provider: openai_compat
  #   model: Qwen/Qwen2.5-72B-Instruct
  #   base_url: ${LOCAL_POOL_BASE_URL}
  #   api_key_env: LOCAL_POOL_API_KEY
  #   price_in: 0.0
  #   price_out: 0.0
  #   capabilities: [tools, streaming]
