# BuildRight model registry — the heterogeneous model pool.
#
# Adding a model = adding an entry here (+ its API key env var). No code changes:
# the provider adapter is selected by `provider`, pricing/health/capabilities flow
# from this file, and the router only considers models whose credentials resolve.
#
# provider: anthropic      → official Anthropic SDK
#           openai_compat  → ANY OpenAI-compatible endpoint (vLLM, Groq, Gemini's
#                            OpenAI endpoint, Together, OpenRouter…) via base_url
# price_in / price_out: USD per million tokens (drives the AI-Ops cost dashboard).
# capabilities: tools | vision | streaming
# roles: which config slots this model may fill (fast / heavy / router / vision / local)

models:
  - id: claude-haiku-4-5
    provider: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    price_in: 1.00
    price_out: 5.00
    capabilities: [tools, vision, streaming]
    context_window: 200000
    latency_class: fast
    roles: [fast, router]
    enabled: true

  - id: claude-sonnet-4-6
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    price_in: 3.00
    price_out: 15.00
    capabilities: [tools, vision, streaming]
    context_window: 200000
    latency_class: heavy
    roles: [heavy, vision]
    enabled: true

  # ---- Free-tier cloud open models (enable by setting the key env) ----------
  # Heterogeneous routing on the public demo without any GPU hosting.

  - id: groq-llama-70b
    provider: openai_compat
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    price_in: 0.59
    price_out: 0.79
    capabilities: [tools, streaming]
    context_window: 128000
    latency_class: fast
    roles: [fast]
    enabled: true          # routable only when GROQ_API_KEY resolves

  - id: gemini-flash
    provider: openai_compat
    model: gemini-2.0-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    price_in: 0.10
    price_out: 0.40
    capabilities: [tools, vision, streaming]
    context_window: 1000000
    latency_class: fast
    roles: [fast]
    enabled: true          # routable only when GEMINI_API_KEY resolves

  # ---- Local / rented GPU pool (Stage 3) -------------------------------------
  # vLLM on the AMD MI300X droplet or the lab A40 server — enable by setting
  # LOCAL_POOL_BASE_URL + LOCAL_POOL_API_KEY; the health loop handles presence.
  #
