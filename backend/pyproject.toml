# Dependencies live in requirements.txt / requirements-dev.txt.
# This file holds tool configuration only (no build-system → not a package).

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires ANTHROPIC_API_KEY",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
